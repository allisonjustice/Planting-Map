<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aligned Form Layout (Grid)</title>
  <style>
    :root {
      --bg:#06242a;
      --panel:#0e3b42;
      --panel-border:#0e6b62;
      --text:#dbfff7;
      --muted:#7bdac6;
      --accent:#18a37a;
      --accent-2:#1fbe8f;
      --input-bg:#083339;
      --shadow:0 2px 10px rgba(0,0,0,.25);
      --radius:12px;
      --control-h:48px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 400px at 50% -10%, rgba(27,88,84,.25), transparent),
        linear-gradient(180deg, #041a1e, #041a1e 220px, #031315);
      padding: 24px;
    }
    .card {
      background: rgba(10, 39, 45, 0.75);
      border: 1px solid rgba(39, 129, 116, 0.45);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }
    .title { font-size: 18px; color: var(--muted); margin: 0 0 16px; }
    /* GRID WRAPPER */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px;}
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    input[type="text"],
    input[type="number"],
    select {
      height: var(--control-h);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }
    input[type="range"] {
      -webkit-appearance: none;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #0a2326;
      border: 2px solid #8ef4d9;
      box-shadow: 0 0 0 3px rgba(142, 244, 217, .15);
      cursor: pointer;
      margin-top: -6px;
    }
    .button {
      height: calc(var(--control-h) * 2 + 8px);
      border-radius: 12px;
      border: 1px solid #198f6f;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: white;
      font-weight: 700;
      font-size: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .subtext { font-size: 12px; color: #a7e7d7; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    /* LAYOUT SPANS TO MATCH THE SCREENSHOT */
    /* Row 1 */
    .zip        { grid-column: 1 / span 5; }
    .plant-date { grid-column: 6 / span 4; }
    .cta        { grid-column: 10 / span 3; }
    /* Row 2 */
    .crit-photo { grid-column: 1 / span 5; }
    .frost      { grid-column: 6 / span 4; }
    .flowering  { grid-column: 10 / span 3; }
    /* Row 3 */
    .veg        { grid-column: 1 / span 12; }
    /* RESPONSIVE */
    @media (max-width: 1100px) {
      .zip, .plant-date, .cta,
      .crit-photo, .frost, .flowering,
      .veg { grid-column: 1 / -1; }
      .button { height: var(--control-h); }
      .row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="title">Inputs</h2>
    <div class="grid">
      <!-- Row 1 -->
      <div class="field zip">
        <div class="label">Location (ZIP Code)</div>
        <div class="row">
          <input type="text" placeholder="29643" inputmode="numeric" class="mono"/>
        </div>
      </div>

      <div class="field plant-date">
        <div class="label">Planting Date</div>
        <div class="row">
          <input type="number" placeholder="Month" aria-label="Month"/>
          <input type="number" placeholder="Day" aria-label="Day"/>
          <input type="number" placeholder="Year" aria-label="Year"/>
        </div>
      </div>

      <div class="cta">
        <button class="button">Calculate Growth Timeline</button>
      </div>

      <!-- Row 2 -->
      <div class="field crit-photo">
        <div class="label">Critical Photoperiod <span title="If unsure, keep 13:55">?</span></div>
        <div class="row">
          <input type="number" placeholder="Hours" aria-label="Hours" value="13"/>
          <input type="number" placeholder="Minutes" aria-label="Minutes" value="55"/>
          <div class="subtext">If unsure, leave at 13:55</div>
        </div>
      </div>

      <div class="field frost">
        <div class="label">Frost Risk Tolerance</div>
        <input type="range" min="0" max="100" value="20" oninput="frostVal.textContent=this.value + '%'" />
        <div class="subtext">Selected: <span id="frostVal" class="mono">20%</span></div>
      </div>

      <div class="field flowering">
        <div class="label">Flowering Duration</div>
        <select>
          <option>8 weeks</option>
          <option>9 weeks</option>
          <option>10 weeks</option>
          <option>11 weeks</option>
        </select>
      </div>

      <!-- Row 3 -->
      <div class="field veg">
        <div class="label">Vegetative Growth Period</div>
        <input type="range" min="1" max="12" value="4" oninput="vegWeeks.textContent=this.value + ' weeks'"/>
        <div class="subtext">Current: <span id="vegWeeks" class="mono">4 weeks</span></div>
      </div>
    </div>
  </div>
  <script>
    // focus ring enhancement (optional)
    for (const el of document.querySelectorAll('input, select, button')) {
      el.addEventListener('focus', () => el.style.boxShadow = '0 0 0 2px rgba(142,244,217,.4)');
      el.addEventListener('blur', () => el.style.boxShadow = '');
    }
  </script>
</body>
</html>
